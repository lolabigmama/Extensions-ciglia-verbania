openapi: 3.1.0
info:
  title: Extensions Ciglia Verbania Calendar
  version: 1.0.0
  description: API privata del calendario condiviso con il GPT della titolare. Orari in Europe/Rome.
servers:
  - url: https://lcfdshnpsgaaqmyupzcy.supabase.co/functions/v1/booking-api
paths:
  /owner/hours:
    get:
      operationId: listWorkingHours
      summary: Legge i giorni e gli orari di lavoro configurati
      security:
        - OwnerApiKey: []
      responses:
        "200": { description: Elenco degli orari }
    post:
      operationId: addWorkingHours
      summary: Aggiunge una fascia lavorativa per un giorno della settimana
      description: Usare solo dopo che la titolare comunica o conferma il giorno e l'orario. weekday usa 0=domenica, 1=lunedì, fino a 6=sabato.
      security:
        - OwnerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [weekday, opens_at, closes_at]
              properties:
                weekday: { type: integer, minimum: 0, maximum: 6 }
                opens_at: { type: string, example: "09:00" }
                closes_at: { type: string, example: "18:00" }
                is_active: { type: boolean, default: true }
      responses:
        "201": { description: Fascia oraria aggiunta }
    delete:
      operationId: removeWorkingHours
      summary: Rimuove una fascia lavorativa tramite ID
      security:
        - OwnerApiKey: []
      parameters:
        - name: id
          in: query
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Fascia rimossa }
  /owner/appointments:
    get:
      operationId: listOwnerAppointments
      summary: Legge gli appuntamenti in un intervallo di date
      security:
        - OwnerApiKey: []
      parameters:
        - name: from
          in: query
          required: true
          schema: { type: string, format: date }
        - name: to
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200": { description: Appuntamenti e dettagli per la titolare }
  /owner/blocks:
    post:
      operationId: blockCalendarTime
      summary: Blocca un intervallo di calendario
      security:
        - OwnerApiKey: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [starts_at, ends_at]
              properties:
                starts_at: { type: string, format: date-time }
                ends_at: { type: string, format: date-time }
                reason: { type: string, maxLength: 240 }
      responses:
        "201": { description: Intervallo bloccato }
  /public/services:
    get:
      operationId: listPublicServices
      summary: Elenca i quattro trattamenti prenotabili con prezzo e durata
      security: []
      responses:
        "200": { description: Trattamenti attivi }
  /public/availability:
    get:
      operationId: getPublicAvailability
      summary: Legge gli orari prenotabili per un trattamento e una data
      security: []
      parameters:
        - name: service_id
          in: query
          required: true
          schema: { type: string, format: uuid }
        - name: date
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        "200": { description: Slot disponibili nel fuso Europe/Rome }
  /public/appointments:
    post:
      operationId: requestPublicAppointment
      summary: Invia una richiesta di appuntamento
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [service_id, starts_at, customer_name, customer_email]
              properties:
                service_id: { type: string, format: uuid }
                starts_at: { type: string, format: date-time }
                customer_name: { type: string, minLength: 2, maxLength: 120 }
                customer_email: { type: string, format: email }
                notes: { type: string, maxLength: 1000 }
      responses:
        "201": { description: Richiesta inserita in attesa di conferma }
        "409": { description: Orario non più disponibile }
components:
  securitySchemes:
    OwnerApiKey:
      type: apiKey
      in: header
      name: x-owner-api-key
